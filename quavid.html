<!DOCTYPE html>

<html lang="en">
<head>
  
<meta charset="UTF-8">
<title>Video Player</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;

/* ANTI COPY */
-webkit-user-select:none;
-moz-user-select:none;
-ms-user-select:none;
user-select:none;
}

/* FULLSCREEN LAYOUT */

html,body{
width:100%;
height:100%;
background:#000;
font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
overflow:hidden;
color:#fff;
}

/* sembunyikan elemen lama */

header,
.actions,
footer{
display:none;
}

/* container fullscreen */

.main{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
display:flex;
align-items:center;
justify-content:center;
background:#000;
}

/* wrapper */

.video-wrapper{
width:100%;
height:100%;
}

/* VIDEO FULLSCREEN */

video{
width:100vw;
height:100vh;
object-fit:contain;
background:#000;
pointer-events:auto;
}

/* popup */

.popup-overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.75);
display:flex;
align-items:center;
justify-content:center;
z-index:9999;
opacity:0;
pointer-events:none;
transition:.25s;
}

.popup-overlay.active{
opacity:1;
pointer-events:auto;
}

.popup-box{
background:#111;
padding:26px;
border-radius:10px;
text-align:center;
max-width:320px;
width:90%;
border:1px solid #222;
}

.popup-box h3{
font-size:18px;
margin-bottom:10px;
}

.popup-box p{
font-size:14px;
color:#aaa;
margin-bottom:18px;
}

.popup-actions{
display:flex;
justify-content:center;
}

.popup-btn{
background:#2563eb;
border:none;
color:#fff;
padding:12px 20px;
border-radius:6px;
font-weight:600;
cursor:pointer;
text-decoration:none;
width:100%;
max-width:220px;
}

.popup-btn:hover{
background:#1d4ed8;
}

</style>

</head>

<body oncontextmenu="return false">

<header>

<div class="header-container">
<div class="logo">popunderrr</div>
<a href="" class="upload-btn">Upload</a>
</div>

</header>

<div class="main">

<div class="video-wrapper">

</style>
</head>

<body oncontextmenu="return false">

<div class="video-wrapper">

  <video id="video"
    autoplay
    muted
    playsinline
    controls
    controlsList="nodownload noplaybackrate">
  </video>

  <!-- CONTINUE WATCHING -->
  <div class="continue-overlay" id="continueOverlay">

    <div class="continue-box">

      <h2>Continue watching?</h2>

      <p>Press continue to keep watching the video.</p>

      <button class="continue-btn" id="continueBtn">
        Continue Watching
      </button>

    </div>

  </div>

</div>

<script>

const video = document.getElementById("video");
const continueOverlay = document.getElementById("continueOverlay");
const continueBtn = document.getElementById("continueBtn");

// ===============================
// AMBIL ?id=
// ===============================

const params = new URLSearchParams(window.location.search);
const VIDEO_ID = params.get("id");


// ===============================
// LOAD VIDEO
// ===============================

if(VIDEO_ID){

  let base = "https://qu.ax/" + VIDEO_ID;

  function loadVideo(src){

    video.src = src;
    video.load();

  }

  // Coba MP4 terlebih dahulu
  loadVideo(base + ".mp4");


  // Jika MP4 gagal, coba MOV
  video.onerror = () => {

    if(!video.dataset.mov){

      video.dataset.mov = "1";

      loadVideo(base + ".mov");

    }

  };


}else{

  document.querySelector(".video-wrapper").innerHTML =
    "<div style='color:#fff;font-size:18px;font-family:Arial;text-align:center;'>Video not found</div>";

}


// ===============================
// CONTINUE SETTING
// ===============================

let continueShown = false;


// ===============================
// CEK VIDEO SUDAH 5 DETIK
// ===============================

video.addEventListener("timeupdate", function(){

  if(
    !continueShown &&
    video.currentTime >= 5
  ){

    continueShown = true;

    // Pause video
    video.pause();

    // Tampilkan overlay
    continueOverlay.style.display = "flex";

  }

});


// ===============================
// TOMBOL CONTINUE
// ===============================

continueBtn.addEventListener("click", function(){

  // Hilangkan overlay
  continueOverlay.style.display = "none";

  // Lanjutkan video
  video.play().catch(function(error){

    console.log("Video play error:", error);

  });

});

</script>
